<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍢 Angkringan POS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">🍢</span>
    <span>Angkringan POS</span>
  </div>
  <nav class="nav" id="nav">
    <button class="nav-btn active" data-tab="kasir">Kasir</button>
    <button class="nav-btn" data-tab="kasbon">Kasbon <span class="badge" id="badgeKasbon">0</span></button>
    <button class="nav-btn" data-tab="rekap">Rekap</button>
    <button class="nav-btn" data-tab="pengeluaran">Pengeluaran</button>
    <button class="nav-btn" data-tab="menu">Kelola Menu</button>
  </nav>
</header>

<main>

  <!-- ================= KASIR ================= -->
  <section class="tab-panel active" id="tab-kasir">

    <div class="kasbon-banner" id="kasbonEditBanner" style="display:none">
      <span id="kasbonEditText"></span>
      <button class="btn btn-sm btn-ghost" id="btnCancelKasbonEdit">✖ Batal Edit</button>
    </div>

    <div class="kasir-layout">
      <div class="kasir-left">
        <div class="cat-tabs" id="catTabs"></div>
        <div class="item-grid" id="itemGrid"></div>
      </div>

      <aside class="kasir-right">
        <h2 class="panel-title">Keranjang</h2>
        <div class="cart-items" id="cartItems"></div>

        <div class="cart-total">
          <span>Total</span>
          <strong id="cartTotal">Rp0</strong>
        </div>

        <!-- Payment Method -->
        <div class="pay-block">
          <div class="pay-label">Metode Pembayaran</div>
          <div class="pay-methods">
            <label class="pay-opt">
              <input type="radio" name="payMethod" value="tunai" checked>
              <span>💵 Tunai</span>
            </label>
            <label class="pay-opt">
              <input type="radio" name="payMethod" value="dana">
              <span>📱 Dana</span>
            </label>
          </div>
        </div>

        <div id="cashBlock">
          <div class="pay-label">Uang Diterima</div>
          <input type="number" id="cashInput" class="input" placeholder="0" min="0" step="500">
          <div class="change-row" id="changeRow">
            <span>Kembalian</span>
            <strong id="changeDisplay">Rp0</strong>
          </div>
        </div>

        <input type="text" id="customerName" class="input" placeholder="Nama pelanggan (untuk kasbon)">

        <div class="cart-actions">
          <button class="btn btn-success" id="btnBayar">💵 Bayar Lunas</button>
          <button class="btn btn-warning" id="btnKasbon">📝 Kasbon</button>
          <button class="btn btn-ghost" id="btnClearCart">🗑 Kosongkan</button>
        </div>
      </aside>
    </div>
  </section>

  <!-- ================= KASBON ================= -->
  <section class="tab-panel" id="tab-kasbon">
    <h2 class="panel-title">Daftar Kasbon / Belum Bayar</h2>
    <div id="kasbonList" class="list"></div>
  </section>

  <!-- ================= REKAP ================= -->
  <section class="tab-panel" id="tab-rekap">
    <h2 class="panel-title">Rekap Penjualan</h2>
<div class="period-tabs" id="periodTabs">
  <button data-period="today" class="active">Hari Ini</button>
  <button data-period="week">Minggu Ini</button>
  <button data-period="month">Bulan Ini</button>
  <button data-period="all">Semua</button>
  <button data-period="custom">📅 Pilih Tanggal</button>
</div>

<div class="date-range" id="dateRange" style="display:none">
  <div class="date-field">
    <label>Dari Tanggal</label>
    <input type="date" id="rekapStart" class="input">
  </div>
  <div class="date-field">
    <label>Sampai Tanggal</label>
    <input type="date" id="rekapEnd" class="input">
  </div>
  <button class="btn btn-primary" id="btnApplyRange" style="align-self:flex-end">✔ Terapkan</button>
  <button class="btn btn-ghost" id="btnResetRange" style="align-self:flex-end">🔄 Reset</button>
</div>

<div class="range-info" id="rangeInfo" style="display:none"></div>

    <h3 class="sub-title" style="margin-top:0">💰 Pemasukan</h3>
    <div class="stat-grid" id="statGrid"></div>

    <h3 class="sub-title">💸 Pengeluaran & Laba</h3>
    <div class="stat-grid" id="statGrid2"></div>

    <h3 class="sub-title">🧾 Transaksi</h3>
    <div id="rekapTrx" class="list"></div>

    <h3 class="sub-title">💸 Detail Pengeluaran</h3>
    <div id="rekapExp" class="list"></div>
  </section>

  <!-- ================= PENGELUARAN ================= -->
  <section class="tab-panel" id="tab-pengeluaran">
    <h2 class="panel-title">Catat Pengeluaran</h2>
    <form class="form-row" id="formExp">
      <input type="date" id="expDate" class="input" required>
      <select id="expCat" class="input" required>
        <option value="warung">🍢 Warung (Makanan & Minuman)</option>
        <option value="rokok">🚬 Rokok</option>
      </select>
      <input type="text" id="expDesc" class="input" placeholder="Keterangan (belanja, gas, dll)" required>
      <input type="number" id="expAmount" class="input" placeholder="Jumlah (Rp)" required min="0">
      <button type="submit" class="btn btn-primary">Tambah</button>
    </form>
    <div id="expList" class="list"></div>
  </section>

  <!-- ================= MENU ================= -->
  <section class="tab-panel" id="tab-menu">
    <h2 class="panel-title">Kelola Menu</h2>
    <form class="form-row" id="formMenu">
      <input type="hidden" id="menuId">
      <input type="text" id="menuName" class="input" placeholder="Nama item" required>
      <select id="menuCat" class="input" required></select>
      <input type="number" id="menuPrice" class="input" placeholder="Harga (Rp)" required min="0">
      <button type="submit" class="btn btn-primary" id="menuSubmitBtn">Tambah</button>
      <button type="button" class="btn btn-ghost" id="menuCancelBtn" style="display:none">Batal</button>
    </form>
    <div id="menuList" class="list"></div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
